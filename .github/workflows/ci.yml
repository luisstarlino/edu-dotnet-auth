name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: edu-dotnet-auth.slnx
  CONFIGURATION: Release

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*
          if-no-files-found: error

  package:
    name: Publish staging artifact
    needs: validate
    # Only package on branch pushes, not on pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: >
          dotnet publish src/EduAuth.Api/EduAuth.Api.csproj
          --configuration ${{ env.CONFIGURATION }}
          --output ${{ github.workspace }}/publish

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduauth-api-staging
          path: publish/**/*
          if-no-files-found: error
